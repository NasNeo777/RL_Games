<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>强化学习实验室</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2129; --border: #2a3441;
    --text: #e6edf3; --muted: #8b98a5; --accent: #4fc3f7; --ok: #66bb6a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.6 -apple-system, "PingFang SC", sans-serif; }
  header { padding: 14px 24px; border-bottom: 1px solid var(--border);
           display: flex; align-items: baseline; gap: 16px; }
  header h1 { margin: 0; font-size: 18px; }
  header .sub { color: var(--muted); font-size: 12px; }
  main { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px 24px; }
  .panel { background: var(--panel); border: 1px solid var(--border);
           border-radius: 10px; padding: 14px; }
  .demo { flex: 1 1 460px; }
  .stats { flex: 1 1 380px; }
  canvas { display: block; width: 100%; border-radius: 8px; background: #0a0e12; }
  .obs-panel { margin-top: 12px; padding: 12px; border: 1px solid var(--border);
               border-radius: 8px; background: #141b22; display: none; }
  .obs-panel.show { display: block; }
  .obs-panel .title { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .obs-panel img { display: block; width: min(220px, 100%); aspect-ratio: 1 / 1;
                   image-rendering: pixelated; border-radius: 8px;
                   border: 1px solid #31404f; background: #0a0e12; }
  .obs-panel .hint { margin-top: 8px; color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
         margin: 10px 0; }
  select, button { background: #232d38; color: var(--text); font: inherit;
                   border: 1px solid var(--border); border-radius: 6px;
                   padding: 5px 12px; cursor: pointer; }
  button.active { border-color: var(--accent); color: var(--accent); }
  button:hover { border-color: var(--accent); }
  .badge { padding: 1px 9px; border-radius: 10px; font-size: 12px;
           background: #232d38; color: var(--muted); }
  .badge.ok { background: rgba(102,187,106,.15); color: var(--ok); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 4px 6px; border-bottom: 1px solid var(--border); }
  td:first-child { color: var(--muted); width: 40%; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted);
       font-weight: 600; }
  #demoInfo { color: var(--muted); font-size: 13px; min-height: 20px; }
  .pbar { height: 10px; border-radius: 5px; background: #232d38;
          overflow: hidden; margin: 4px 0 8px; }
  .pbar > div { height: 100%; border-radius: 5px; transition: width .6s;
                background: linear-gradient(90deg, #4fc3f7, #66bb6a); }
  #progress .note { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  #progress b { color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>🤖 强化学习实验室</h1>
  <span class="sub">二阶摆甩起并稳定倒立 · DQN / PPO · 演示训练中的最新 / 最优模型</span>
</header>
<main>
  <div class="panel demo">
    <h2>模型演示</h2>
    <div class="row">
      <select id="runSelect"></select>
      <button id="btnBest" class="active">最优模型</button>
      <button id="btnLatest">最新模型</button>
      <button id="btnReplay">🔄 重新演示</button>
      <button id="btnAutoNew"
              title="每跑完一遍演示就重新读取检查点:训练中模型更新了就用新模型跑下一局,没更新则原样重放">♻️ 跑完刷新模型</button>
      <label>速度 <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select></label>
    </div>
    <canvas id="stage" width="640" height="480"></canvas>
    <div id="obsPanel" class="obs-panel">
      <div id="obsTitle" class="title">送给 PPO 的观测</div>
      <img id="obsPreview" alt="agent observation preview">
      <div class="hint">这里显示模型每一步真正吃进去的预处理图像。</div>
    </div>
    <div class="row" id="demoInfo">载入中…</div>
  </div>

  <div class="panel stats">
    <h2>训练状态(每 5 秒刷新)</h2>
    <table id="metaTable"></table>
    <h2 style="margin-top:16px">🎯 离练成还有多远</h2>
    <div id="progress"></div>
    <h2 style="margin-top:16px">评估回报曲线</h2>
    <canvas id="curve" width="520" height="220"></canvas>
    <h2 style="margin-top:16px">成功率曲线</h2>
    <canvas id="rate" width="520" height="120"></canvas>
  </div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
let state = { run: null, which: "best", demo: null, playT: 0, lastTs: 0,
              autoNew: false, refreshing: false };
const JUMP_OBS_SIZE = 84;

function setObsPreview(spec, frame) {
  const panel = $("obsPanel"), img = $("obsPreview"), title = $("obsTitle");
  if (spec && (spec.type === "video" || spec.type === "jump")) {
    panel.classList.remove("show");
    img.removeAttribute("src");
    return;
  }
  if (!frame || !frame.obs) {
    panel.classList.remove("show");
    img.removeAttribute("src");
    return;
  }
  panel.classList.add("show");
  title.textContent = spec.obs_label || "送给 PPO 的观测";
  if (img.src !== frame.obs) img.src = frame.obs;
}

function drawLiveJumpObs(ctx, totalW, sceneW, H, panelX, panelW, labelH, spec) {
  if (!state.jumpObsCanvas) {
    state.jumpObsCanvas = document.createElement("canvas");
    state.jumpObsCanvas.width = JUMP_OBS_SIZE;
    state.jumpObsCanvas.height = JUMP_OBS_SIZE;
    state.jumpObsCtx = state.jumpObsCanvas.getContext("2d", { willReadFrequently: true });
  }
  const obsCtx = state.jumpObsCtx;
  const src = ctx.canvas;
  const dprX = src.width / totalW;
  const dprY = src.height / H;
  const crop = spec.obs_crop || { left: 0, top: 0, right: 1, bottom: 1 };
  const sx = Math.round(sceneW * crop.left * dprX);
  const sy = Math.round(H * crop.top * dprY);
  const sw = Math.max(1, Math.round(sceneW * (crop.right - crop.left) * dprX));
  const sh = Math.max(1, Math.round(H * (crop.bottom - crop.top) * dprY));
  obsCtx.clearRect(0, 0, JUMP_OBS_SIZE, JUMP_OBS_SIZE);
  obsCtx.drawImage(src, sx, sy, sw, sh, 0, 0, JUMP_OBS_SIZE, JUMP_OBS_SIZE);
  const data = obsCtx.getImageData(0, 0, JUMP_OBS_SIZE, JUMP_OBS_SIZE);
  const px = data.data;
  for (let i = 0; i < px.length; i += 4) {
    const gray = Math.max(0, Math.min(255,
      0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]));
    px[i] = gray;
    px[i + 1] = gray;
    px[i + 2] = gray;
    px[i + 3] = 255;
  }
  obsCtx.putImageData(data, 0, 0);

  const maxW = panelW - 24;
  const maxH = H - labelH - 24;
  const s = Math.min(maxW / JUMP_OBS_SIZE, maxH / JUMP_OBS_SIZE);
  const dw = JUMP_OBS_SIZE * s, dh = JUMP_OBS_SIZE * s;
  const dx = panelX + (panelW - dw) / 2;
  const dy = labelH + (H - labelH - dh) / 2;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(state.jumpObsCanvas, dx, dy, dw, dh);
  ctx.imageSmoothingEnabled = true;
  ctx.strokeStyle = "#31404f";
  ctx.lineWidth = 1;
  ctx.strokeRect(dx - 0.5, dy - 0.5, dw + 1, dh + 1);
}

/* ===== 渲染器注册表:新游戏在这里加一个 type 对应的画法 ===== */
const RENDERERS = {
  // 通用视频渲染器:Gymnasium 适配器(gym_adapter.py)抓的 JPEG 帧直接播放。
  // 任何通过 GymEnv 接入的游戏都走这里,不用再写专属画法。
  // 帧里带 obs 字段时(如 mario 的预处理观测)左右分屏:
  // 左边原始画面,右边 agent 网络真正看到的输入。
  // 滑动窗口预解码:播放头前 12 帧提前建 Image,身后 24 帧外释放,
  // 既不卡顿也不会把整局几百张解码位图都压进内存。
  video(ctx, W, H, spec, frames, fIdx, frac) {
    const ahead = Math.min(fIdx + 12, frames.length);
    for (let i = fIdx; i < ahead; i++) {
      const fr = frames[i];
      if (!fr._img) { fr._img = new Image(); fr._img.src = fr.img; }
      if (fr.obs && !fr._obsImg) {
        fr._obsImg = new Image();
        fr._obsImg.src = fr.obs;
      }
    }
    for (let i = 0; i < fIdx - 24; i++) {
      frames[i]._img = null;
      frames[i]._obsImg = null;
    }
    const f = frames[fIdx];
    if (!f._img) { f._img = new Image(); f._img.src = f.img; }
    ctx.clearRect(0, 0, W, H);
    const img = f._img.complete && f._img.naturalWidth ? f._img
      : state.lastVideoImg;                  // 没解码完就保持上一帧,不闪黑
    const hasObs = !!f.obs;
    let obsImg = null, nextObsImg = null;
    if (hasObs) {
      if (!f._obsImg) { f._obsImg = new Image(); f._obsImg.src = f.obs; }
      obsImg = f._obsImg.complete && f._obsImg.naturalWidth ? f._obsImg
        : state.lastObsImg;
      if (nf && nf.obs) {
        if (!nf._obsImg) { nf._obsImg = new Image(); nf._obsImg.src = nf.obs; }
        nextObsImg = nf._obsImg.complete && nf._obsImg.naturalWidth ? nf._obsImg : null;
      }
    }
    const labelH = hasObs ? 20 : 0, gap = hasObs ? 10 : 0;
    const mainW = hasObs ? Math.round(W * 0.62) : W;
    // 像素风游戏放大时关闭平滑,像素锐利不发糊
    const drawIn = (image, x0, w) => {
      ctx.imageSmoothingEnabled = false;
      const s = Math.min(w / image.naturalWidth,
                         (H - labelH) / image.naturalHeight);
      const dw = image.naturalWidth * s, dh = image.naturalHeight * s;
      const dx = x0 + (w - dw) / 2;
      ctx.drawImage(image, dx, labelH + (H - labelH - dh) / 2, dw, dh);
      ctx.imageSmoothingEnabled = true;
      return dx;                             // 实际绘制的左边界,给标签对齐用
    };
    if (img) {
      state.lastVideoImg = img;
      const dx = drawIn(img, 0, mainW);
      if (hasObs) {
        ctx.fillStyle = "#8b98a5";
        ctx.font = "12px -apple-system, 'PingFang SC', sans-serif";
        ctx.fillText("原始画面(仅供观看)", dx, 14, mainW - dx);
      }
    } else {
      ctx.fillStyle = "#8b98a5"; ctx.font = "13px sans-serif";
      ctx.fillText("画面加载中…", W / 2 - 36, H / 2);
    }
    if (hasObs && obsImg) {
      state.lastObsImg = obsImg;
      const dx = drawIn(obsImg, mainW + gap, W - mainW - gap);
      ctx.fillStyle = "#8b98a5";
      ctx.font = "12px -apple-system, 'PingFang SC', sans-serif";
      ctx.fillText(spec.obs_label || "agent 观测", dx, 14, W - dx);
    }
    if (f.score != null) {
      ctx.fillStyle = "#e6edf3";
      ctx.font = "bold 24px -apple-system, 'PingFang SC', sans-serif";
      ctx.fillText(`得分 ${f.score}`, 12, labelH + 32);
    }
  },

  snake(ctx, W, H, spec, frames, fIdx, frac) {
    const f = frames[fIdx];
    const g = spec.grid;
    const size = Math.min(W, H) - 16;
    const cell = size / g;
    const ox = (W - size) / 2, oy = (H - size) / 2;
    ctx.clearRect(0, 0, W, H);
    // 棋盘
    for (let y = 0; y < g; y++)
      for (let x = 0; x < g; x++) {
        ctx.fillStyle = (x + y) % 2 ? "#131b24" : "#0f161e";
        ctx.fillRect(ox + x * cell, oy + y * cell, cell, cell);
      }
    ctx.strokeStyle = "#2a3441"; ctx.lineWidth = 2;
    ctx.strokeRect(ox, oy, size, size);
    // 食物(苹果 + 叶子)
    if (f.f) {
      const fx = ox + (f.f[0] + 0.5) * cell, fy = oy + (f.f[1] + 0.5) * cell;
      ctx.fillStyle = "#ef5350";
      ctx.beginPath(); ctx.arc(fx, fy + cell * 0.04, cell * 0.32, 0, 7); ctx.fill();
      ctx.strokeStyle = "#66bb6a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(fx, fy - cell * 0.24);
      ctx.quadraticCurveTo(fx + cell * 0.18, fy - cell * 0.42,
                           fx + cell * 0.26, fy - cell * 0.3);
      ctx.stroke();
    }
    // 蛇身:从尾到头画,头最亮;死亡时头变红
    const n = f.s.length;
    for (let i = n - 1; i >= 0; i--) {
      const [x, y] = f.s[i];
      const t = 1 - i / Math.max(n - 1, 1);          // 尾 0 → 头 1
      ctx.fillStyle = i === 0
        ? (f.dead ? "#ef5350" : "#aee571")
        : `rgb(${40 + 30 * t}, ${130 + 60 * t}, ${70 + 30 * t})`;
      const pad = cell * (i === 0 ? 0.06 : 0.1);
      const r = cell * 0.22;
      ctx.beginPath();
      ctx.roundRect(ox + x * cell + pad, oy + y * cell + pad,
                    cell - 2 * pad, cell - 2 * pad, r);
      ctx.fill();
    }
    // 眼睛:按头的移动方向摆
    if (n > 1 && !f.dead) {
      const [hx, hy] = f.s[0], [bx, by] = f.s[1];
      const dx = Math.sign(hx - bx), dy = Math.sign(hy - by);
      const cx = ox + (hx + 0.5) * cell, cy = oy + (hy + 0.5) * cell;
      // 垂直于前进方向错开两只眼,再往前进方向偏一点
      const px = -dy, py = dx;
      ctx.fillStyle = "#0a0e12";
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(cx + (dx * 0.18 + s * px * 0.16) * cell,
                cy + (dy * 0.18 + s * py * 0.16) * cell,
                cell * 0.07, 0, 7);
        ctx.fill();
      }
    }
    // 得分(画在棋盘内,加阴影保证压着蛇身也可读)
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.9)"; ctx.shadowBlur = 6;
    ctx.fillStyle = "#e6edf3";
    ctx.font = "bold 16px -apple-system, 'PingFang SC', sans-serif";
    ctx.fillText(`得分 ${f.score} / ${spec.goal}`, ox + 8, oy + 22);
    if (f.dead) {
      ctx.fillStyle = "#ef5350"; ctx.font = "bold 14px sans-serif";
      ctx.fillText("✕ 死亡", ox + size - 64, oy + 22);
    }
    ctx.restore();
  },

  snake_gate(ctx, W, H, spec, frames, fIdx, frac) {
    const f = frames[fIdx] || frames[0];
    if (!f) return;
    const gates = f.gates || [], segments = f.snakeSegments || [], bullets = f.bullets || [];
    const nG = gates.length;
    const active = f.action;
    const now = performance.now() / 1000;
    const clamp01 = v => Math.max(0, Math.min(1, v));
    const sx = W / 390, sy = H / 693, s = Math.min(sx, sy);
    const X = v => v * sx, Y = v => v * sy, S = v => v * s;
    const font = (px, weight = 700) => `${weight} ${Math.round(S(px))}px -apple-system, "PingFang SC", sans-serif`;

    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";

    const textStroke = (text, x, y, size, fill = "#fff", stroke = "#151515", weight = 800, width = 4) => {
      ctx.font = font(size, weight);
      ctx.lineJoin = "round";
      ctx.strokeStyle = stroke;
      ctx.lineWidth = S(width);
      ctx.strokeText(text, x, y);
      ctx.fillStyle = fill;
      ctx.fillText(text, x, y);
    };
    const round = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#465c6d");
    bg.addColorStop(0.45, "#6f9fbd");
    bg.addColorStop(1, "#213342");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.strokeStyle = "#173247";
    ctx.lineWidth = S(2);
    for (let i = 0; i < 8; i++) {
      const x = X(30 + i * 58), y = Y(560 + Math.sin(i) * 22);
      ctx.beginPath(); ctx.moveTo(x, H); ctx.quadraticCurveTo(x + S(18), y, x + S(2), y - S(64)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + S(2), y - S(34)); ctx.lineTo(x - S(16), y - S(54)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + S(2), y - S(44)); ctx.lineTo(x + S(17), y - S(66)); ctx.stroke();
    }
    ctx.restore();

    const drawRock = (cx, cy, w, h, label, hp, hot, cleared) => {
      ctx.save();
      ctx.translate(cx, cy);
      const r = S(10), hw = w / 2, hh = h / 2;
      const grd = ctx.createLinearGradient(0, -hh, 0, hh);
      grd.addColorStop(0, cleared ? "#d8e8d5" : "#efefef");
      grd.addColorStop(1, cleared ? "#8eb789" : "#a9a9a9");
      ctx.fillStyle = grd;
      ctx.strokeStyle = hot ? "#ffffff" : "#1d1d1d";
      ctx.lineWidth = hot ? S(4) : S(2);
      ctx.shadowColor = hot ? "rgba(255,255,255,.95)" : "rgba(0,0,0,.45)";
      ctx.shadowBlur = hot ? S(16) : S(5);
      ctx.beginPath();
      ctx.moveTo(-hw + r, -hh); ctx.lineTo(hw - r, -hh + S(4));
      ctx.lineTo(hw, -S(4)); ctx.lineTo(hw - S(18), hh - S(2));
      ctx.lineTo(-hw + S(20), hh); ctx.lineTo(-hw, S(8));
      ctx.lineTo(-hw + S(6), -hh + S(12)); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(40,40,40,.32)";
      ctx.lineWidth = S(1.5);
      ctx.beginPath(); ctx.moveTo(-S(18), -S(14)); ctx.lineTo(S(6), S(2)); ctx.lineTo(-S(5), S(17)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(S(18), -S(18)); ctx.lineTo(S(28), S(8)); ctx.stroke();
      ctx.restore();
      textStroke(String(label), cx - S(36), cy + S(8), 26, "#f8f8f8", "#151515", 850, 4);
      if (hp != null && !cleared) textStroke(String(Math.round(hp)), cx - S(20), cy + S(36), 20, "#ffffff", "#202020", 850, 3);
    };

    const drawGate = (x, y, w, h, title, cost, hot, colorA = "#fff05a", colorB = "#ff9f4b") => {
      ctx.save();
      if (hot) { ctx.shadowColor = "rgba(255,255,255,.9)"; ctx.shadowBlur = S(18); }
      const grd = ctx.createLinearGradient(x, y, x + w, y + h);
      grd.addColorStop(0, colorA); grd.addColorStop(0.62, "#ffe35a"); grd.addColorStop(1, colorB);
      ctx.fillStyle = grd;
      round(x, y, w, h, S(8)); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.25)";
      round(x + S(5), y + S(5), w - S(10), h * 0.34, S(6)); ctx.fill();
      ctx.strokeStyle = "#2a2a2a"; ctx.lineWidth = S(3);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.moveTo(x + w, y); ctx.lineTo(x + w, y + h); ctx.stroke();
      ctx.restore();
      ctx.textAlign = "center";
      textStroke(title, x + w / 2, y - S(4), 21, "#ffe84e", "#111", 900, 4);
      textStroke(`-${Math.max(1, Math.round(cost))}`, x + w / 2 - S(25), y + h * 0.67, 24, "#fff", "#111", 900, 4);
      ctx.textAlign = "left";
    };

    const drawChest = (cx, cy, opened, hot, value) => {
      ctx.save();
      ctx.translate(cx, cy);
      if (hot) { ctx.shadowColor = "rgba(255,221,64,.9)"; ctx.shadowBlur = S(15); }
      const grd = ctx.createLinearGradient(0, -S(20), 0, S(20));
      grd.addColorStop(0, opened ? "#bde7aa" : "#ffd84b");
      grd.addColorStop(1, opened ? "#5dbf6a" : "#d9861d");
      ctx.fillStyle = grd;
      round(-S(27), -S(17), S(54), S(34), S(8)); ctx.fill();
      ctx.strokeStyle = "#5b330a"; ctx.lineWidth = S(3); ctx.stroke();
      ctx.fillStyle = "#7b42e7";
      ctx.fillRect(-S(8), -S(17), S(16), S(34));
      ctx.fillStyle = "#f4b41b";
      ctx.beginPath(); ctx.arc(0, 0, S(8), 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      textStroke(String(Math.round(value)), cx - S(16), cy + S(35), 23, "#fff", "#111", 900, 4);
    };

    const laneX = lane => X(82 + lane * 112);
    const drawSnakeSegment = seg => {
      const hasPath = Number.isFinite(seg.pathX) && Number.isFinite(seg.pathY);
      const cx = hasPath ? X(38 + seg.pathX * 314) : laneX(seg.lane || 0);
      const cy = hasPath ? Y(70 + seg.pathY * 254 + (f.coverage || 0) * 42) : Y(105 + (seg.depth || 0) * 330 + (f.coverage || 0) * 165);
      const hpRatio = clamp01((seg.hp || 0) / Math.max(1, seg.maxHp || 1));
      const dead = seg.status === "dead" || hpRatio <= 0;
      const entering = seg.status === "entered";
      const w = hasPath ? X(82) : X(86 + 26 * (seg.depth || 0.1));
      const h = hasPath ? Y(42) : Y(42 + 10 * (seg.depth || 0.1));
      ctx.save();
      ctx.globalAlpha = dead ? 0.45 : entering ? 0.72 : 1;

  "2048"(ctx, W, H, spec, frames, fIdx, frac) {
    const f = frames[fIdx];
    const g = spec.size;
    ctx.clearRect(0, 0, W, H);
    const size = Math.min(W, H) - 50;
    const ox = (W - size) / 2, oy = (H - size + 30) / 2;
    // 棋盘底
    ctx.fillStyle = "#bbada0";
    ctx.beginPath(); ctx.roundRect(ox, oy, size, size, 8); ctx.fill();
    const gap = size * 0.025, cell = (size - gap * (g + 1)) / g;
    const TILE = { 2:"#eee4da", 4:"#ede0c8", 8:"#f2b179", 16:"#f59563",
                   32:"#f67c5f", 64:"#f65e3b", 128:"#edcf72", 256:"#edcc61",
                   512:"#edc850", 1024:"#edc53f", 2048:"#edc22e" };
    let maxTile = 0;
    for (let y = 0; y < g; y++)
      for (let x = 0; x < g; x++) {
        const v = f.b[y][x];
        maxTile = Math.max(maxTile, v);
        const cx = ox + gap + x * (cell + gap), cy = oy + gap + y * (cell + gap);
        ctx.fillStyle = "#cdc1b4";
        ctx.beginPath(); ctx.roundRect(cx, cy, cell, cell, 5); ctx.fill();
        if (!v) continue;
        // 新刷出来的数字做个"弹出"动画
        const isNew = f.n && f.n[0] === x && f.n[1] === y;
        const s = isNew ? cell * (0.55 + 0.45 * Math.min(1, frac / 0.5)) : cell;
        const off = (cell - s) / 2;
        ctx.fillStyle = TILE[v] || "#3c3a32";
        ctx.beginPath(); ctx.roundRect(cx + off, cy + off, s, s, 5); ctx.fill();
        ctx.fillStyle = v <= 4 ? "#776e65" : "#f9f6f2";
        const fs = v < 100 ? 0.45 : v < 1000 ? 0.36 : 0.28;
        ctx.font = `bold ${Math.round(s * fs)}px -apple-system, sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(v, cx + cell / 2, cy + cell / 2 + 1);
      }
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#e6edf3";
    ctx.font = "bold 16px -apple-system, 'PingFang SC', sans-serif";
    ctx.fillText(`得分 ${f.score} · 最大 ${maxTile} / ${spec.goal}`, ox, oy - 10);
    if (f.dead) {
      ctx.fillStyle = "#ef5350"; ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("✕ 无路可走", ox + size, oy - 10);
      ctx.textAlign = "left";

  tetris(ctx, W, H, spec, frames, fIdx, frac) {
    const f = frames[fIdx];
    ctx.clearRect(0, 0, W, H);
    const cell = Math.floor((H - 24) / spec.h);
    const bw = cell * spec.w, bh = cell * spec.h;
    const ox = Math.round((W - bw) / 2) - 36, oy = Math.round((H - bh) / 2);
    const COLORS = ["", "#4fc3f7", "#ffd54f", "#ba68c8", "#81c784",
                    "#e57373", "#7986cb", "#ffb74d"];
    // 棋盘
    ctx.fillStyle = "#0a0e12";
    ctx.fillRect(ox, oy, bw, bh);
    ctx.strokeStyle = "#2a3441"; ctx.lineWidth = 2;
    ctx.strokeRect(ox - 1, oy - 1, bw + 2, bh + 2);
    const placed = new Set((f.p || []).map(([x, y]) => x + "," + y));
    for (let y = 0; y < spec.h; y++)
      for (let x = 0; x < spec.w; x++) {
        const v = +f.b[y][x];
        if (!v) continue;
        ctx.fillStyle = COLORS[v];
        ctx.fillRect(ox + x * cell + 1, oy + y * cell + 1, cell - 2, cell - 2);
        if (placed.has(x + "," + y)) {   // 刚落下的方块描白边
          ctx.strokeStyle = "#e6edf3"; ctx.lineWidth = 1.5;
          ctx.strokeRect(ox + x * cell + 1.5, oy + y * cell + 1.5,
                         cell - 3, cell - 3);
        }
      }
    // 消行闪白(本帧棋盘是消行前的状态,白光随 frac 淡出)
    if (f.clr && f.clr.length) {
      ctx.fillStyle = `rgba(230,237,243,${0.85 * (1 - frac)})`;
      for (const y of f.clr)
        ctx.fillRect(ox, oy + y * cell, bw, cell);
    }
    // 侧栏:行数 + 下一块预览
    const sx = ox + bw + 18;
    ctx.fillStyle = "#e6edf3";
    ctx.font = "bold 16px -apple-system, 'PingFang SC', sans-serif";
    ctx.fillText(`${f.lines} / ${spec.goal} 行`, sx, oy + 18);
    ctx.fillStyle = "#8b98a5"; ctx.font = "12px sans-serif";
    ctx.fillText("下一块", sx, oy + 44);
    const nc = cell * 0.7;
    ctx.fillStyle = COLORS[f.next];
    for (const [x, y] of spec.pieces[f.next] || [])
      ctx.fillRect(sx + x * nc, oy + 52 + y * nc, nc - 1, nc - 1);
    if (f.dead) {
      ctx.fillStyle = "#ef5350"; ctx.font = "bold 14px sans-serif";
      ctx.fillText("✕ 堆到顶了", sx, oy + bh - 8);
    }
  },

  mountain_car(ctx, W, H, spec, frames, fIdx, frac) {
    const a = frames[fIdx], b = frames[Math.min(fIdx + 1, frames.length - 1)];
    const x = a.x + (b.x - a.x) * frac;
    const v = a.v;
    const mtnY = px => Math.sin(3 * px) * 0.45 + 0.55;   // 0~1
    const xMin = spec.min_pos, xMax = spec.max_pos;
    const X = px => 30 + (px - xMin) / (xMax - xMin) * (W - 60);
    const Y = py => H - 30 - py * (H - 80);
    ctx.clearRect(0, 0, W, H);
    // 山体
    ctx.fillStyle = "#1f2a36"; ctx.strokeStyle = "#4fc3f7"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(xMin), H);
    for (let i = 0; i <= 120; i++) {
      const px = xMin + (xMax - xMin) * i / 120;
      ctx.lineTo(X(px), Y(mtnY(px)));
    }
    ctx.lineTo(X(xMax), H); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    for (let i = 0; i <= 120; i++) {
      const px = xMin + (xMax - xMin) * i / 120;
      const xc = X(px), yc = Y(mtnY(px));
      i ? ctx.lineTo(xc, yc) : ctx.moveTo(xc, yc);
    }
    ctx.stroke();
    // 终点旗
    const gx = X(spec.goal), gy = Y(mtnY(spec.goal));
    ctx.strokeStyle = "#66bb6a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx, gy - 40); ctx.stroke();
    ctx.fillStyle = "#66bb6a";
    ctx.beginPath(); ctx.moveTo(gx, gy - 40); ctx.lineTo(gx + 18, gy - 33);
    ctx.lineTo(gx, gy - 26); ctx.closePath(); ctx.fill();
    // 左/右极值
    for (const [px, color, label] of [[a.xmin, "#ffb74d", "← 最左"],
                                       [a.xmax, "#81d4fa", "最右 →"]]) {
      ctx.strokeStyle = color + "88"; ctx.setLineDash([4, 4]);
      const xc = X(px); ctx.beginPath();
      ctx.moveTo(xc, Y(0)); ctx.lineTo(xc, Y(mtnY(px))); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = color; ctx.font = "11px sans-serif";
      ctx.fillText(label, xc - 18, Y(0) + 14);
    }
    // 小车(法向偏移使其贴在山坡上)
    const dy = (mtnY(x + 0.01) - mtnY(x - 0.01)) / 0.02;
    const ang = Math.atan2(-dy * (H - 80), (W - 60) / (xMax - xMin));
    const cx = X(x), cy = Y(mtnY(x));
    ctx.save();
    ctx.translate(cx, cy - 8);
    ctx.rotate(-ang);
    ctx.fillStyle = a.a === 0 ? "#ffb74d" : a.a === 2 ? "#81d4fa" : "#e6edf3";
    ctx.fillRect(-14, -8, 28, 12);
    ctx.fillStyle = "#0a0e12";
    ctx.beginPath(); ctx.arc(-9, 6, 4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(9, 6, 4, 0, 7); ctx.fill();
    // 推力箭头
    if (a.a !== 1) {
      ctx.strokeStyle = a.a === 2 ? "#81d4fa" : "#ffb74d"; ctx.lineWidth = 2;
      const dir = a.a === 2 ? 1 : -1;
      ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(dir * 18, -4);
      ctx.lineTo(dir * 14, -8); ctx.moveTo(dir * 18, -4);
      ctx.lineTo(dir * 14, 0); ctx.stroke();
    }
    ctx.restore();
    // 读数
    ctx.fillStyle = "#8b98a5"; ctx.font = "12px monospace";
    ctx.fillText(`位置 x = ${x.toFixed(3)}  速度 v = ${v.toFixed(4)}`,
                 8, H - 10);
    if (x >= spec.goal) {
      ctx.fillStyle = "#66bb6a"; ctx.font = "bold 14px sans-serif";
      ctx.fillText("● 登顶成功", 8, 22);
    }
  },

  double_pendulum(ctx, W, H, spec, frames, fIdx, frac) {
    const a = frames[fIdx], b = frames[Math.min(fIdx + 1, frames.length - 1)];
    const lerpAngle = (x, y) => {
      let d = y - x;
      if (d > Math.PI) d -= 2 * Math.PI;
      if (d < -Math.PI) d += 2 * Math.PI;
      return x + d * frac;
    };
    const t1 = lerpAngle(a.t1, b.t1), t2 = lerpAngle(a.t2, b.t2);
    const cx = W / 2, cy = H / 2;
    const scale = Math.min(W, H) / 4.6;
    // theta 从竖直向下方向量起
    const x1 = cx + scale * spec.l1 * Math.sin(t1);
    const y1 = cy + scale * spec.l1 * Math.cos(t1);
    const x2 = x1 + scale * spec.l2 * Math.sin(t1 + t2);
    const y2 = y1 + scale * spec.l2 * Math.cos(t1 + t2);
    const h = -Math.cos(t1) - Math.cos(t1 + t2);
    const up = !!a.up;   // 由环境判定:高度够且角速度小,才算稳定倒立

    ctx.clearRect(0, 0, W, H);
    // 倒立区高度线
    const yGoal = cy - scale * spec.success_height;
    ctx.strokeStyle = "rgba(102,187,106,.35)"; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(0, yGoal); ctx.lineTo(W, yGoal); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(102,187,106,.6)"; ctx.font = "12px sans-serif";
    ctx.fillText(`倒立区(需稳定保持 ${spec.hold_seconds ?? 5} 秒)`, 8, yGoal - 6);
    // 连杆
    ctx.lineCap = "round";
    ctx.strokeStyle = "#4fc3f7"; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.strokeStyle = up ? "#66bb6a" : "#81d4fa";
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    // 关节
    for (const [x, y, r, c] of [[cx, cy, 7, "#e6edf3"],
                                [x1, y1, 6, "#e6edf3"],
                                [x2, y2, 8, up ? "#66bb6a" : "#ffb74d"]]) {
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
    // 力矩指示
    if (a.tau) {
      ctx.fillStyle = "rgba(255,183,77,.9)"; ctx.font = "13px sans-serif";
      ctx.fillText(a.tau > 0 ? "力矩 ↻" : "力矩 ↺", x1 + 12, y1 - 10);
    }
    // 高度读数 + 倒立状态
    ctx.fillStyle = "#8b98a5"; ctx.font = "12px monospace";
    ctx.fillText(`末端高度 h = ${h.toFixed(2)} / 2.00`, 8, H - 10);
    if (up) {
      const remain = Math.max(0, (spec.hold_seconds ?? 5)
                              - (a.hold ?? 0) * spec.frame_dt);
      ctx.fillStyle = "#66bb6a"; ctx.font = "bold 14px sans-serif";
      ctx.fillText(`● 倒立稳定中  ${remain.toFixed(1)}s`, 8, 22);
      // 进度条:已稳定时间 / 目标时间
      const bw = 140, bh = 6, bx = 8, by = 30;
      ctx.fillStyle = "rgba(102,187,106,.2)";
      ctx.fillRect(bx, by, bw, bh);
      const frac = 1 - remain / (spec.hold_seconds ?? 5);
      ctx.fillStyle = "#66bb6a";
      ctx.fillRect(bx, by, bw * frac, bh);
    }
  },

  // 跳一跳:2.5D 等距视角。每一帧 = 一次跳跃,分三段连续播放:
  //   ① 蓄力(棋子下压,力度条按"按压时长决定的跳跃距离"涨)
  //   ② 起跳(沿抛物线飞向目标台,镜头不动)
  //   ③ 落定后镜头平移,把刚踩中的台子拉回锚点 —— 因为这一帧结尾的取景
  //      正好等于下一帧开头的取景,连跳之间画面完全连续(不会"跳变")。
  jump(ctx, W, H, spec, frames, fIdx, frac) {
    const f = frames[fIdx];
    const nf = frames[fIdx + 1];           // 下一帧,用来提前画出即将滑入的新台子
    const ahead = Math.min(fIdx + 12, frames.length);
    for (let i = fIdx; i < ahead; i++) {
      const fr = frames[i];
      if (fr.obs && !fr._obsImg) {
        fr._obsImg = new Image();
        fr._obsImg.src = fr.obs;
      }
    }
    for (let i = 0; i < fIdx - 24; i++) {
      frames[i]._obsImg = null;
    }
    const hasObs = !!f.obs;
    let obsImg = null, nextObsImg = null;
    if (hasObs) {
      if (!f._obsImg) { f._obsImg = new Image(); f._obsImg.src = f.obs; }
      obsImg = f._obsImg.complete && f._obsImg.naturalWidth ? f._obsImg
        : state.lastObsImg;
      if (nf && nf.obs) {
        if (!nf._obsImg) { nf._obsImg = new Image(); nf._obsImg.src = nf.obs; }
        nextObsImg = nf._obsImg.complete && nf._obsImg.naturalWidth ? nf._obsImg : null;
      }
    }
    const gap = hasObs ? 10 : 0;
    const sceneW = hasObs ? Math.round(W * 0.62) : W;
    const panelW = W - sceneW - gap;
    const labelH = hasObs ? 20 : 0;
    const CHARGE_END = 0.24, JUMP_END = 0.66;
    const ease = t => t * t * (3 - 2 * t);
    const lerp = (a, b, t) => a + (b - a) * t;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#0f1419";
    ctx.fillRect(0, 0, W, H);
    // 暖粉灰背景
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#d8bab7"); bg.addColorStop(1, "#c39d9a");
    ctx.fillStyle = bg; ctx.fillRect(0, 0, sceneW, H);

    // 世界坐标 (a,b):+a=右前轴,+b=左前轴;两条等距斜轴让路线左右拐
    const p0 = f.p0, p1 = f.p1, land = f.land;   // [a, b, half]
    const dist = Math.abs(land[0] - p0[0]) + Math.abs(land[1] - p0[1]);
    const standing = dist < 1e-6;
    const dir = (land[0] - p0[0]) > 1e-6 ? 1 : -1;   // 本次跳跃方向:右前 / 左前
    const powerN = Math.max(0, Math.min(1,
      (dist - spec.d_min) / (spec.d_max - spec.d_min)));

    // 等距投影 (a,b)→屏幕,锚点固定在偏左下;镜头中心 (ca,cb) 锁当前台,落定后平移到目标台
    // STEP_Y/STEP_X = 0.556 对齐参考实现的 arrayRatio(每跳纵向位移 = 距离 × 该比值)
    const STEP_X = sceneW * 0.15, STEP_Y = sceneW * 0.15 * 0.556, SCALE = sceneW * 0.13;
    const anchorX = sceneW * 0.42, anchorY = H * 0.70;
    let ca = p0[0], cb = p0[1];
    if (!standing && f.ok && frac > JUMP_END) {
      const e = ease((frac - JUMP_END) / (1 - JUMP_END));
      ca = lerp(p0[0], p1[0], e); cb = lerp(p0[1], p1[1], e);
    }
    const proj = (a, b) => [
      anchorX + ((a - ca) - (b - cb)) * STEP_X,
      anchorY - ((a - ca) + (b - cb)) * STEP_Y];

    // 底座样式表(需与 envs/jump.py 的 N_STYLES 一致):方块 / 圆柱,各色,外加灰条纹高台
    const STYLES = [
      { top: "#3a8059", lft: "#eef3f3", rgt: "#cdd7d8" },                          // 绿方
      { round: 1, top: "#e6ebed", lft: "#f3f6f7", rgt: "#bcc6ca", ring: "#9aa6ab" }, // 白圆
      { top: "#3f7cc0", lft: "#eef2f6", rgt: "#cbd4dd" },                          // 蓝方
      { top: "#d98a4f", lft: "#f4ece4", rgt: "#ddccbb" },                          // 橙方
      { round: 1, top: "#a673c8", lft: "#f0ecf4", rgt: "#c9bcd4", ring: "#7f55a0" }, // 紫圆
      { top: "#8a9099", lft: "#e9edf0", rgt: "#c2c9cf", stripes: 1, tall: 1 },     // 灰条纹高台
    ];

    function platform(center, style) {
      const [cx, cy] = proj(center[0], center[1]);
      const rx = center[2] * SCALE, ry = rx * 0.5;     // 2:1 等距
      const c = STYLES[((style % STYLES.length) + STYLES.length) % STYLES.length];
      const h = Math.max(rx * 1.05, sceneW * 0.045) * (c.tall ? 1.7 : 1);
      ctx.fillStyle = "rgba(60,30,40,.18)";            // 地面软阴影
      ctx.beginPath();
      ctx.ellipse(cx + rx * 0.35, cy + h + ry * 0.6, rx * 1.15, ry * 1.15, 0, 0, 7);
      ctx.fill();
      if (c.round) {                                    // 圆柱
        ctx.fillStyle = c.rgt;
        ctx.beginPath();
        ctx.moveTo(cx - rx, cy); ctx.lineTo(cx - rx, cy + h);
        ctx.ellipse(cx, cy + h, rx, ry, 0, Math.PI, 0, true);
        ctx.lineTo(cx + rx, cy);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = c.top;
        ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = c.ring; ctx.lineWidth = Math.max(2, rx * 0.22);
        ctx.beginPath(); ctx.ellipse(cx, cy, rx * 0.58, ry * 0.58, 0, 0, 7); ctx.stroke();
      } else {                                          // 方块
        const T = [cx, cy - ry], R = [cx + rx, cy], B = [cx, cy + ry], L = [cx - rx, cy];
        ctx.fillStyle = c.lft;                          // 左侧面
        ctx.beginPath();
        ctx.moveTo(L[0], L[1]); ctx.lineTo(B[0], B[1]);
        ctx.lineTo(B[0], B[1] + h); ctx.lineTo(L[0], L[1] + h);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = c.rgt;                          // 右侧面
        ctx.beginPath();
        ctx.moveTo(R[0], R[1]); ctx.lineTo(B[0], B[1]);
        ctx.lineTo(B[0], B[1] + h); ctx.lineTo(R[0], R[1] + h);
        ctx.closePath(); ctx.fill();
        if (c.stripes) {                                // 横向条纹
          ctx.strokeStyle = "rgba(0,0,0,.16)"; ctx.lineWidth = Math.max(2, h * 0.12);
          for (const k of [0.33, 0.66]) {
            const yk = h * k;
            ctx.beginPath();
            ctx.moveTo(L[0], L[1] + yk); ctx.lineTo(B[0], B[1] + yk);
            ctx.lineTo(R[0], R[1] + yk); ctx.stroke();
          }
        }
        ctx.fillStyle = c.top;                          // 顶面
        ctx.beginPath();
        ctx.moveTo(T[0], T[1]); ctx.lineTo(R[0], R[1]);
        ctx.lineTo(B[0], B[1]); ctx.lineTo(L[0], L[1]);
        ctx.closePath(); ctx.fill();
      }
      return [cx, cy, rx, ry];
    }

    // 由远及近画(深度 = a+b,越大越远):新台子(滑入)→ 目标台 → 起跳台
    if (nf && (Math.abs(nf.p1[0] - p1[0]) > 1e-6 || Math.abs(nf.p1[1] - p1[1]) > 1e-6))
      platform(nf.p1, nf.s1);
    platform(p1, f.s1);
    const [, , rx0, ry0] = platform(p0, f.s0);

    // 正中靶心:目标台心冒颗星(随镜头一起动)
    if (f.perfect) {
      const [tx, ty] = proj(p1[0], p1[1]);
      ctx.fillStyle = "#ffd54f"; ctx.font = `bold ${Math.round(sceneW * 0.04)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText("★", tx, ty + sceneW * 0.012);
      ctx.textAlign = "left";
    }

    // 棋子位置 + 形变:蓄力 → 起跳(飞到实际落点)→ 落定(贴目标台心,镜头平移)
    // rot=腾空时绕身子翻转一整圈(对齐参考实现的 rotateBy(0.5, dir*360))
    const apex = sceneW * 0.10 + 0.32 * dist * STEP_X;
    let pa = p0[0], pb = p0[1], lift = 0, sx = 1, sy = 1, rot = 0;
    if (standing) {                          // 开局静止帧:站在起跳台
      // 取默认值
    } else if (frac < CHARGE_END) {          // ① 蓄力:下压,力度越大压越狠
      const ct = frac / CHARGE_END;
      sy = 1 - 0.34 * powerN * ct; sx = 1 + 0.20 * powerN * ct;
    } else if (f.ok && frac < JUMP_END) {    // ② 起跳:抛物线飞向实际落点,翻转一圈
      const jt = (frac - CHARGE_END) / (JUMP_END - CHARGE_END);
      pa = lerp(p0[0], land[0], jt); pb = lerp(p0[1], land[1], jt);
      lift = apex * Math.sin(Math.PI * jt);
      rot = dir * 2 * Math.PI * jt;
    } else if (f.ok) {                        // ③ 落定:从落点稳到台心,镜头同步平移回锚点
      const pt = ease((frac - JUMP_END) / (1 - JUMP_END));
      pa = lerp(land[0], p1[0], pt); pb = lerp(land[1], p1[1], pt);
    } else {                                  // 失败:冲出去栽进缝里(边翻边掉)
      const jt = (frac - CHARGE_END) / (1 - CHARGE_END);
      pa = lerp(p0[0], land[0], jt); pb = lerp(p0[1], land[1], jt);
      lift = apex * Math.sin(Math.PI * jt)
           - (jt > 0.55 ? (jt - 0.55) / 0.45 * H * 0.6 : 0);
      rot = dir * 2 * Math.PI * jt;
    }
    const [bx, footY] = proj(pa, pb);
    const by = footY - lift;

    // 落地影子(贴地时清晰,腾空时缩小变淡)
    if (lift < apex * 0.92) {
      const shf = Math.max(0.15, 1 - Math.max(0, lift) / apex);
      ctx.fillStyle = `rgba(40,20,30,${0.3 * shf})`;
      ctx.beginPath();
      ctx.ellipse(bx, footY, rx0 * 0.5 * shf, ry0 * 0.5 * shf, 0, 0, 7);
      ctx.fill();
    }

    // 棋子本体:黑色,锥形身子 + 球头 + 高光(按 sx/sy 形变);腾空时绕身子中心翻转
    const ch = sceneW * 0.135 * sy, headR = sceneW * 0.135 * 0.19, bw = sceneW * 0.135 * 0.3 * sx;
    const cyHead = by - ch + headR;
    ctx.save();
    if (rot) {                               // 绕身子中线翻转一整圈
      const pivot = by - ch * 0.5;
      ctx.translate(bx, pivot); ctx.rotate(rot); ctx.translate(-bx, -pivot);
    }
    ctx.fillStyle = "#222129";
    ctx.beginPath();
    ctx.moveTo(bx - bw, by);
    ctx.quadraticCurveTo(bx - bw * 0.55, by - ch * 0.55, bx, cyHead);
    ctx.quadraticCurveTo(bx + bw * 0.55, by - ch * 0.55, bx + bw, by);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx, by, bw, bw * 0.42, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(bx, cyHead, headR, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.32)";
    ctx.beginPath(); ctx.arc(bx - headR * 0.3, cyHead - headR * 0.3, headR * 0.38, 0, 7); ctx.fill();
    ctx.restore();

    // 蓄力力度条:蓄力阶段在棋子上方涨起,直观展示"按压时长 → 跳多远"
    if (!standing && frac < CHARGE_END) {
      const ct = frac / CHARGE_END, bw2 = sceneW * 0.16, bh2 = sceneW * 0.018;
      const bx2 = bx - bw2 / 2, by2 = by - ch - sceneW * 0.07;
      ctx.fillStyle = "rgba(0,0,0,.18)";
      ctx.beginPath(); ctx.roundRect(bx2, by2, bw2, bh2, bh2 / 2); ctx.fill();
      ctx.fillStyle = "#ff7043";
      ctx.beginPath(); ctx.roundRect(bx2, by2, bw2 * powerN * ct, bh2, bh2 / 2); ctx.fill();
      ctx.fillStyle = "#5d4037"; ctx.font = `${Math.round(sceneW * 0.022)}px sans-serif`;
      ctx.textAlign = "center"; ctx.fillText("蓄力", bx, by2 - sceneW * 0.012);
      ctx.textAlign = "left";
    }

    // 比分
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 6;
    ctx.fillStyle = "#fff";
    ctx.font = "bold 20px -apple-system, 'PingFang SC', sans-serif";
    ctx.fillText(`连跳 ${f.score} / ${spec.goal}`, 16, 32);
    ctx.restore();
    if (!standing && !f.ok && frac > 0.6) {
      ctx.fillStyle = "#c62828"; ctx.font = "bold 16px sans-serif";
      ctx.fillText("✕ 没踩稳", sceneW - 100, 32);
    }

    if (hasObs) {
      ctx.fillStyle = "#141b22";
      ctx.fillRect(sceneW + gap, 0, panelW, H);
      if (spec.obs_live) {
        drawLiveJumpObs(ctx, W, sceneW, H, sceneW + gap, panelW, labelH, spec);
      } else if (obsImg) {
        state.lastObsImg = obsImg;
        ctx.imageSmoothingEnabled = false;
        const maxW = panelW - 24;
        const maxH = H - labelH - 24;
        const s = Math.min(maxW / obsImg.naturalWidth, maxH / obsImg.naturalHeight);
        const dw = obsImg.naturalWidth * s, dh = obsImg.naturalHeight * s;
        const dx = sceneW + gap + (panelW - dw) / 2;
        const dy = labelH + (H - labelH - dh) / 2;
        const blend = nf && nextObsImg ? Math.max(0, Math.min(1, frac)) : 0;
        ctx.save();
        ctx.globalAlpha = 1 - blend;
        ctx.drawImage(obsImg, dx, dy, dw, dh);
        if (nextObsImg && blend > 0) {
          ctx.globalAlpha = blend;
          ctx.drawImage(nextObsImg, dx, dy, dw, dh);
        }
        ctx.restore();
        ctx.imageSmoothingEnabled = true;
        ctx.strokeStyle = "#31404f";
        ctx.lineWidth = 1;
        ctx.strokeRect(dx - 0.5, dy - 0.5, dw + 1, dh + 1);
      }
      ctx.fillStyle = "#8b98a5";
      ctx.font = "12px -apple-system, 'PingFang SC', sans-serif";
      ctx.fillText(spec.obs_label || "agent 观测", sceneW + gap + 12, 14, panelW - 24);
    }
  },
};

/* ===== 演示动画 ===== */
const HOLD_AT_SUCCESS = 2.0;   // 成功瞬间定格 + 庆祝多少秒

function animate(ts) {
  requestAnimationFrame(animate);
  const d = state.demo;
  if (!d || !d.frames || !d.frames.length) return;
  const cv = $("stage"), ctx = cv.getContext("2d");
  // 视网膜屏适配:画布物理分辨率 = CSS 尺寸 × devicePixelRatio,
  // 再用 transform 把坐标系缩回 CSS 尺寸,渲染器代码不用感知。
  const dpr = window.devicePixelRatio || 1;
  const cssW = cv.clientWidth || 640;
  const cssH = d.spec.type === "snake_gate"
    ? Math.round(cssW * 16 / 9)
    : Math.round(cssW * 0.75);
  if (cv.width !== Math.round(cssW * dpr)
      || cv.height !== Math.round(cssH * dpr)) {
    cv.width = Math.round(cssW * dpr);
    cv.height = Math.round(cssH * dpr);
    cv.style.height = cssH + "px";
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const dt = (ts - state.lastTs) / 1000;
  state.lastTs = ts;
  const speed = parseFloat($("speed").value);
  state.playT += dt * speed;
  const total = d.frames.length * d.spec.frame_dt;
  const holdEnd = total + (d.success ? HOLD_AT_SUCCESS : 0);
  if (state.playT >= holdEnd) {
    if (state.autoNew) {
      // 跑完一遍:重新拉演示。检查点更新过(训练中 mtime 变化)
      // 服务器会用新模型跑新一局,没更新则缓存秒回、等同重放。
      if (!state.refreshing) {
        state.refreshing = true;
        loadDemo(false, true).then(ok => {
          if (!ok) state.playT = 0;   // 拉取失败:先重放旧的,下一遍再试
          state.refreshing = false;
        });
      }
      state.playT = holdEnd;          // 定格末帧,等新一局加载
    } else {
      state.playT = 0;                // 循环播放
    }
  }
  // 进入定格阶段:fpos 卡在最后一帧,celebT 计成功庆祝时间
  let fpos, celebT = 0;
  if (state.playT < total) {
    fpos = state.playT / d.spec.frame_dt;
  } else {
    fpos = d.frames.length - 1;
    celebT = state.playT - total;
  }
  const fIdx = Math.min(Math.floor(fpos), d.frames.length - 1);
  setObsPreview(d.spec, d.frames[fIdx]);
  const renderer = RENDERERS[d.spec.type];
  if (renderer) renderer(ctx, cssW, cssH, d.spec, d.frames,
                         fIdx, Math.min(1, fpos - fIdx));
  if (d.success && celebT > 0) drawCelebration(ctx, cssW, cssH, d, celebT);
}

function drawCelebration(ctx, W, H, d, t) {
  // 半透明遮罩,呼吸感
  const a = 0.35 + 0.15 * Math.sin(t * 6);
  ctx.fillStyle = `rgba(102,187,106,${a * 0.25})`;
  ctx.fillRect(0, 0, W, H);
  // 中央标题
  const cx = W / 2, cy = H / 2;
  const scale = 1 + 0.05 * Math.sin(t * 8);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(102,187,106,.9)"; ctx.shadowBlur = 24;
  ctx.fillStyle = "#66bb6a";
  ctx.font = "bold 56px -apple-system, 'PingFang SC', sans-serif";
  ctx.fillText("🎉 成功!", 0, -22);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#e6edf3";
  ctx.font = "16px -apple-system, 'PingFang SC', sans-serif";
  const tip = d.swingup_seconds != null
    ? `用时 ${d.swingup_seconds}s · 总回报 ${d.return}`
    : d.score != null
      ? `得分 ${d.score} · 总回报 ${d.return}`
      : `共 ${d.steps} 步 · 总回报 ${d.return}`;
  ctx.fillText(tip, 0, 24);
  ctx.restore();
  // 角落彩带式光点
  for (let i = 0; i < 20; i++) {
    const ang = i * 0.314 + t * 1.5;
    const r = 220 + 20 * Math.sin(t * 3 + i);
    ctx.fillStyle = ["#66bb6a", "#4fc3f7", "#ffb74d"][i % 3];
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.arc(cx + r * Math.cos(ang), cy + r * Math.sin(ang) * 0.6,
            3 + 2 * Math.sin(t * 5 + i), 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// 成功文案按环境自适应:双摆有摆起用时,小游戏有得分,其余通用
function successText(d) {
  if (d.swingup_seconds != null) return `稳定倒立,摆起用时 ${d.swingup_seconds}s`;
  if (d.score != null) return `通关,得分 ${d.score}`;
  return "成功";
}

async function loadDemo(replay = false, auto = false) {
  if (!state.run) return false;
  $("demoInfo").textContent = auto ? "♻️ 跑完一遍,正在刷新模型…"
    : replay ? "正在重新运行一局…" : "正在加载演示…";
  try {
    const r = await fetch(`/api/demo?run=${encodeURIComponent(state.run)}`
                          + `&which=${state.which}${replay ? "&replay=1" : ""}`);
    const d = await r.json();
    if (d.error) { $("demoInfo").textContent = "⚠ " + d.error; return false; }
    state.demo = d; state.playT = 0;
    state.lastVideoImg = null; state.lastObsImg = null;
    setObsPreview(d.spec, d.frames[0]);
    $("demoInfo").innerHTML =
      `算法 <b>${d.algo.toUpperCase()}</b> · ${d.which === "best" ? "最优" : "最新"}模型 · ` +
      `回报 <b>${d.return}</b> · ${d.steps} 步 · ` +
      (d.success
        ? `<span class="badge ok">✅ ${successText(d)}</span>`
        : '<span class="badge">未成功</span>'
          + (d.score != null ? ` <span class="badge">得分 ${d.score}</span>` : ""));
    return true;
  } catch (e) { $("demoInfo").textContent = "⚠ " + e; return false; }
}

/* ===== 训练进度估计 =====
   "练成" = 评估成功率 100%(train.py 的 solved)。预算步数来自本仓库
   真实跑出来的数据(src=实测)或文献/外推(src=估算),键是 env_algo。 */
const BUDGETS = {
  mountain_car_dqn:    { steps: 16_000,      src: "实测" },
  tetris_dqn:          { steps: 570_000,     src: "实测" },
  mario_ppo:           { steps: 4_300_000,   src: "实测" },
  flappy_bird_ppo:     { steps: 23_200_000,  src: "实测" },
  double_pendulum_ppo: { steps: 155_000_000, src: "实测" },
  snake_dqn:           { steps: 3_000_000,   src: "估算" },
  snake_gate_dqn:      { steps: 80_000,      src: "估算" },
  snake_gate_ppo:      { steps: 120_000,     src: "估算" },
  jump_dqn:            { steps: 4_000,       src: "实测" },
  "2048_td2048":       { steps: 10_000_000,  src: "估算" },
  "2048_dqn":  { tip: "⚠️ DQN 在 2048 上极慢(百万步仍千分级),强烈建议 --algo td2048,几分钟就能合出 2048" },
  flappy_bird_dqn: { tip: "DQN 几分钟能学个大概,但 777 根管道的练成标准未见 DQN 达成过;要挂机练成请用 --algo ppo(实测约 2300 万步)" },
};

function fmtDuration(sec) {
  if (sec < 90) return Math.max(1, Math.round(sec)) + " 秒";
  if (sec < 5400) return Math.round(sec / 60) + " 分钟";
  return (sec / 3600).toFixed(1) + " 小时";
}

// 用 metrics 尾部的相邻记录估算训练速度(步/秒);
// 跳过断点续练造成的时间回卷(dt<=0)
function trainRate(recs) {
  let ds = 0, dt = 0, used = 0;
  for (let i = recs.length - 1; i > 0 && used < 8; i--) {
    const a = recs[i - 1], b = recs[i];
    const t = (b.time ?? 0) - (a.time ?? 0), s = b.env_steps - a.env_steps;
    if (t > 0 && s > 0) { ds += s; dt += t; used++; }
  }
  return dt > 0 ? ds / dt : null;
}

function renderProgress(meta, recs) {
  const el = $("progress");
  if (!meta) { el.innerHTML = '<div class="note">等待训练数据…</div>'; return; }
  if (meta.solved) {
    el.innerHTML = '<div class="pbar"><div style="width:100%"></div></div>'
      + '<div class="note">✅ <b>已练成</b>(评估成功率 100%)。'
      + '加 --forever 可以继续打磨。</div>';
    return;
  }
  const b = BUDGETS[`${meta.env}_${meta.algo}`];
  if (b && b.tip) {
    el.innerHTML = `<div class="note">${b.tip}</div>`;
    return;
  }
  if (!b) {
    el.innerHTML = '<div class="note">这个环境/算法组合还没有参考数据,'
      + '盯下方成功率曲线就好。</div>';
    return;
  }
  const steps = meta.env_steps ?? 0;
  const pct = Math.min(99, steps / b.steps * 100);
  const rate = recs && trainRate(recs);
  let eta = "";
  if (steps >= b.steps) {
    eta = "已超出参考步数——任务有运气成分,继续挂机或看成功率曲线。";
  } else if (rate) {
    eta = `按当前 <b>${Math.round(rate)}</b> 步/秒,预计还需 `
        + `<b>~${fmtDuration((b.steps - steps) / rate)}</b>`;
  }
  el.innerHTML = `<div class="pbar"><div style="width:${pct}%"></div></div>`
    + `<div class="note">${pct.toFixed(0)}% · 已训 ${(steps / 1000).toFixed(0)}k`
    + ` / 参考 ${(b.steps / 1000).toFixed(0)}k 步(${b.src})。${eta}</div>`;
}

/* ===== 训练状态与曲线 ===== */
function drawCurve(cv, recs, key, color, fmt) {
  const ctx = cv.getContext("2d"), W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  if (recs.length < 2) {
    ctx.fillStyle = "#8b98a5"; ctx.font = "12px sans-serif";
    ctx.fillText("数据不足,等待训练评估…", 10, 20);
    return;
  }
  const xs = recs.map(r => r.env_steps), ys = recs.map(r => r[key]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y1 - y0 < 1e-6) { y0 -= 1; y1 += 1; }
  const px = x => 36 + (x - x0) / (x1 - x0) * (W - 46);
  const py = y => H - 18 - (y - y0) / (y1 - y0) * (H - 30);
  ctx.strokeStyle = "#2a3441";
  ctx.beginPath(); ctx.moveTo(36, 6); ctx.lineTo(36, H - 18);
  ctx.lineTo(W - 6, H - 18); ctx.stroke();
  ctx.fillStyle = "#8b98a5"; ctx.font = "10px monospace";
  ctx.fillText(fmt(y1), 2, py(y1) + 4); ctx.fillText(fmt(y0), 2, py(y0));
  ctx.fillText((x1 / 1000).toFixed(0) + "k 步", W - 60, H - 4);
  ctx.strokeStyle = color; ctx.lineWidth = 1.8;
  ctx.beginPath();
  recs.forEach((r, i) => i ? ctx.lineTo(px(r.env_steps), py(r[key]))
                           : ctx.moveTo(px(r.env_steps), py(r[key])));
  ctx.stroke();
}

async function refreshStats() {
  try {
    const runs = await (await fetch("/api/runs")).json();
    const sel = $("runSelect");
    const names = runs.map(r => r.run);
    if (names.join() !== [...sel.options].map(o => o.value).join()) {
      sel.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join("");
      if (!state.run || !names.includes(state.run)) {
        state.run = names[0] || null;
        if (state.run) loadDemo();
      }
      sel.value = state.run || "";
    }
    const meta = runs.find(r => r.run === state.run);
    if (meta) {
      $("metaTable").innerHTML = [
        ["环境 / 算法", `${meta.env} / ${(meta.algo || "?").toUpperCase()}`],
        ["状态", meta.solved
          ? '<span class="badge ok">✅ 已练成</span>'
          : '<span class="badge">训练中…</span>'],
        ["训练回合", meta.episode ?? "-"],
        ["环境步数", (meta.env_steps ?? 0).toLocaleString()],
        ["最近评估回报", meta.eval_return ?? "-"],
        ["历史最优回报", meta.best_return ?? "-"],
        ["评估成功率", meta.success_rate != null
          ? (meta.success_rate * 100).toFixed(0) + "%" : "-"],
        ...(meta.swingup_seconds != null
          ? [["平均摆起用时", meta.swingup_seconds + " 秒"]] : []),
        ["最后更新", meta.updated ?? "-"],
      ].map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
    }
    if (state.run) {
      const recs = await (await fetch(
        `/api/metrics?run=${encodeURIComponent(state.run)}`)).json();
      renderProgress(meta, recs);
      drawCurve($("curve"), recs, "eval_return", "#4fc3f7",
                v => v.toFixed(0));
      drawCurve($("rate"), recs, "success_rate", "#66bb6a",
                v => (v * 100).toFixed(0) + "%");
    }
  } catch (e) { /* 服务器暂不可达,下个周期再试 */ }
}

/* ===== 事件绑定 ===== */
$("runSelect").onchange = e => { state.run = e.target.value; loadDemo(); refreshStats(); };
$("btnBest").onclick = () => { state.which = "best";
  $("btnBest").classList.add("active"); $("btnLatest").classList.remove("active");
  loadDemo(); };
$("btnLatest").onclick = () => { state.which = "latest";
  $("btnLatest").classList.add("active"); $("btnBest").classList.remove("active");
  loadDemo(); };
$("btnReplay").onclick = () => loadDemo(true);
$("btnAutoNew").onclick = () => {
  state.autoNew = !state.autoNew;
  $("btnAutoNew").classList.toggle("active", state.autoNew);
};

refreshStats();
setInterval(refreshStats, 5000);
requestAnimationFrame(ts => { state.lastTs = ts; requestAnimationFrame(animate); });
</script>
